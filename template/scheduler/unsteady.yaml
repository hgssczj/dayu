position: cloud
pod-template:
  image: repo:5000/dayuhub/scheduler:test-csy-01
  imagePullPolicy: Always
  env:
    - name: SCH_CONFIG_EXTRACTION_NAME
      value: simple
    - name: SCH_SCENARIO_RETRIEVAL_NAME
      value: steady
    - name: SCH_STARTUP_POLICY_NAME
      value: fixed
    - name: SCH_POLICY_RETRIEVAL_NAME
      value: simple
    - name: SCH_SELECTION_POLICY_NAME
      value: fixed
    - name: SCH_INITIAL_DEPLOYMENT_POLICY_NAME
      value: full
    - name: SCH_REDEPLOYMENT_POLICY_NAME
      value: non
    - name: SCH_AGENT_NAME
      value: unsteady
    - name: SCH_AGENT_PARAMETERS
      value: >
        {
          'sch_param':{
              'record_path':'UnsteadyAgent-test',
              'if_stop_record_in_single_cycle':1
          },
          'unsteady_param':{
              'schedule_type':'macro',
              'kb_path':'test_kb/kb2',
              'unit_logic_frame_num_max':400,
              'all_delay_cons_info':[
                                  {
                                    'value':0.3,
                                    'adjust':0.333
                                  },
                                  {
                                    'value':0.4,
                                    'adjust':0.25
                                  }
                                ],
              'all_acc_cons_info':[
                                  {
                                    'value':0.6,
                                    'adjust':1.16
                                  },
                                  {
                                    'value':0.7,
                                    'adjust':1
                                  }
                                ],
              'all_delay_weight_info':[
                                  {
                                    'value':0.5,
                                    'adjust':1.8
                                  },
                                  {
                                    'value':0.6,
                                    'adjust':1.5
                                  },
                                  {
                                    'value':0.7,
                                    'adjust':1.286
                                  },
                                  {
                                    'value':0.8,
                                    'adjust':1.125
                                  },
                                  {
                                    'value':0.9,
                                    'adjust':1
                                  }
                                ],
              'default_policy':{
                  'fps':30,
                  'resolution':'360p',
                  'buffer_size':4,
                  'edge_serv_num':0
              },
              'acc_sample_interval':100,
              'history_lenghth':3,
              'stop_threshold':0.1,
              'if_online_train':0,
              'cluster_threshold':0.1,
              'macro_update_interval':0.5,
              'context_anylze_type':1,
              'coeff_info':{
                              'step_coeff':{
                                  'start_value':10,
                                  'add_interval':5,
                                  'min_value':10,
                                  'max_value':1000,
                                  'cur_value':10
                              },
                          },
              'feedback_weight':{
                      'delay_decrease_weight':{
                          'fps': -1,
                          'resolution': -1,
                          'buffer_size': 0,
                          'edge_serv_num': 0,
                      },
                      'acc_increase_weight':{
                          'fps': 1,
                          'resolution': 1,
                          'buffer_size': -1,
                          'edge_serv_num': -1,
                      }
                  },
              'corrector_param' : {
                      'corrector_pool_threshold':0.01,
                      'detect':{
                          'n':2,
                          'coeff_window_length':10,
                          'x_sample_window_length':10,
                          'y_sample_window_length':10
                      },
                      'classify':{
                          'n':2,
                          'coeff_window_length':10,
                          'x_sample_window_length':10,
                          'y_sample_window_length':10
                      },
                      'trans':{
                          'n':1,
                          'coeff_window_length':10,
                          'x_sample_window_length':10,
                          'y_sample_window_length':10
                      },
                      'acc':{
                          'n':1,
                          'coeff_window_length':10,
                          'x_sample_window_length':10,
                          'y_sample_window_length':10
                      }
                  },
              'queue_param':{
                  'detect_edge':{
                      'max_diff_thr':50,
                      'min_diff_thr':10,
                      'min_anylze_thr':10,
                      'stable_thr':0.01,
                      'fit_thr':0.9,
                      'history_window_length':100
                  },
                  'detect_cloud':{
                      'max_diff_thr':50,
                      'min_diff_thr':10,
                      'min_anylze_thr':10,
                      'stable_thr':0.01,
                      'fit_thr':0.9,
                      'history_window_length':100
                  },
                  'classify_edge':{
                      'max_diff_thr':50,
                      'min_diff_thr':10,
                      'min_anylze_thr':10,
                      'stable_thr':0.01,
                      'fit_thr':0.9,
                      'history_window_length':100
                  },
                  'classify_cloud':{
                      'max_diff_thr':50,
                      'min_diff_thr':10,
                      'min_anylze_thr':10,
                      'stable_thr':0.01,
                      'fit_thr':0.9,
                      'history_window_length':100
                  }
              }
          }
        }
port-open:
  pos: cloud
  port: 9000
file-mount:
  - pos: cloud
    path: 'scheduler/unsteady/'
