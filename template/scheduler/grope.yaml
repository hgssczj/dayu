position: cloud
pod-template:
  image: repo:5000/dayuhub/scheduler:test-csy-01
  imagePullPolicy: Always
  env:
    - name: SCH_CONFIG_EXTRACTION_NAME
      value: simple
    - name: SCH_SCENARIO_RETRIEVAL_NAME
      value: steady
    - name: SCH_STARTUP_POLICY_NAME
      value: fixed
    - name: SCH_POLICY_RETRIEVAL_NAME
      value: simple
    - name: SCH_SELECTION_POLICY_NAME
      value: fixed
    - name: SCH_INITIAL_DEPLOYMENT_POLICY_NAME
      value: full
    - name: SCH_REDEPLOYMENT_POLICY_NAME
      value: non
    - name: SCH_AGENT_NAME
      value: grope
    - name: SCH_AGENT_PARAMETERS
      value: >
        {
          'sch_param':{
              'record_path':'GropeAgent-test',
              'if_stop_record_in_single_cycle':1
          },
          'grope_param':{
              'grope_type':'Gecko',
              'goal_type':'prefer',
              'kb_path':'test_kb/kb2',
              'unit_logic_frame_num_max':400,
              'all_delay_cons_info':[
                                  {
                                    'value':0.3,
                                    'adjust':0.1667
                                  },
                                  {
                                    'value':0.4,
                                    'adjust':0.125
                                  }
                                ],
              'all_acc_cons_info':[
                                  {
                                    'value':0.6,
                                    'adjust':1.16
                                  },
                                  {
                                    'value':0.7,
                                    'adjust':1
                                  }
                                ],
              'all_delay_weight_info':[
                                  {
                                    'value':0.5,
                                    'adjust':1.8
                                  },
                                  {
                                    'value':0.6,
                                    'adjust':1.5
                                  },
                                  {
                                    'value':0.7,
                                    'adjust':1.286
                                  },
                                  {
                                    'value':0.8,
                                    'adjust':1.125
                                  },
                                  {
                                    'value':0.9,
                                    'adjust':1
                                  }
                                ],
              'default_policy':{
                  'fps':30,
                  'resolution':'360p',
                  'buffer_size':4,
                  'edge_serv_num':0
              },
              'grope_type_param':{
                    'MadEye':{
                                'max_queue_size':10
                            },
                    'AdaMEC':{
                            },
                    'Gecko':{
                                'speed_threshold':10
                            },
              },
              'corrector_param' : {
                      'corrector_pool_threshold':0.01,
                      'detect':{
                          'n':2,
                          'coeff_window_length':10,
                          'x_sample_window_length':10,
                          'y_sample_window_length':10
                      },
                      'classify':{
                          'n':2,
                          'coeff_window_length':10,
                          'x_sample_window_length':10,
                          'y_sample_window_length':10
                      },
                      'trans':{
                          'n':1,
                          'coeff_window_length':10,
                          'x_sample_window_length':10,
                          'y_sample_window_length':10
                      },
                      'acc':{
                          'n':1,
                          'coeff_window_length':10,
                          'x_sample_window_length':10,
                          'y_sample_window_length':10
                      }
                  },
              'queue_param':{
                  'detect_edge':{
                      'max_diff_thr':50,
                      'min_diff_thr':10,
                      'min_anylze_thr':10,
                      'stable_thr':0.01,
                      'fit_thr':0.9,
                      'history_window_length':100
                  },
                  'detect_cloud':{
                      'max_diff_thr':50,
                      'min_diff_thr':10,
                      'min_anylze_thr':10,
                      'stable_thr':0.01,
                      'fit_thr':0.9,
                      'history_window_length':100
                  },
                  'classify_edge':{
                      'max_diff_thr':50,
                      'min_diff_thr':10,
                      'min_anylze_thr':10,
                      'stable_thr':0.01,
                      'fit_thr':0.9,
                      'history_window_length':100
                  },
                  'classify_cloud':{
                      'max_diff_thr':50,
                      'min_diff_thr':10,
                      'min_anylze_thr':10,
                      'stable_thr':0.01,
                      'fit_thr':0.9,
                      'history_window_length':100
                  }
              }
          }
        }
port-open:
  pos: cloud
  port: 9000
file-mount:
  - pos: cloud
    path: 'scheduler/grope/'
